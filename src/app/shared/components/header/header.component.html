<header class="header">
  <div class="header-container">
    <div class="brand">
      <a routerLink="/tasks" class="brand-link" id="brand-logo">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">TaskFlow</span>
          <span class="brand-badge">Angular 20</span>
        </div>
      </a>
    </div>

    <nav class="nav-links" aria-label="Main Navigation">
      <a routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" id="nav-tasks">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Tasks</span>
      </a>

      <a routerLink="/tasks/new" routerLinkActive="active" class="nav-item" id="nav-new-task">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>New Task</span>
      </a>
    </nav>

    <div class="header-actions">
      <!-- Error Simulation Toggle for testing assessment resilience -->
      <button
        type="button"
        class="simulation-toggle-btn"
        [class.is-simulating]="stateService.simulateError()"
        (click)="toggleSimulateError()"
        [title]="stateService.simulateError() ? 'API error simulation is ACTIVE. Click to disable.' : 'Click to test API error handling (Assessment Requirement 8)'"
        id="toggle-simulate-error-btn">
        <span class="status-indicator"></span>
        <span class="toggle-text">{{ stateService.simulateError() ? 'Simulate Error (Active)' : 'Simulate Error' }}</span>
      </button>
    </div>
  </div>
</header>
