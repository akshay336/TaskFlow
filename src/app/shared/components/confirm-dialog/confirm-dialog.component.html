@if (isOpen()) {
  <div
    class="dialog-backdrop"
    (click)="onBackdropClick($event)"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'dialog-title'"
    [attr.aria-describedby]="'dialog-desc'">
    <div class="dialog-panel" id="confirm-dialog-panel">
      <div class="dialog-header">
        <div class="dialog-icon" [class.destructive]="isDestructive()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </div>
        <div class="dialog-headings">
          <h3 id="dialog-title" class="dialog-title">{{ title() }}</h3>
          <p id="dialog-desc" class="dialog-message">{{ message() }}</p>
        </div>
      </div>

      <div class="dialog-actions">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onCancel()"
          id="dialog-cancel-btn">
          {{ cancelText() }}
        </button>
        <button
          type="button"
          [class]="isDestructive() ? 'btn btn-danger' : 'btn btn-primary'"
          (click)="onConfirm()"
          id="dialog-confirm-btn">
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
