<article
  class="task-card"
  [class.is-completed]="task().status === 'completed'"
  [class.is-overdue]="isOverdue()"
  id="task-card-{{ task().id }}">
  <!-- Card Header: Badges & Overdue Alert -->
  <div class="card-top">
    <div class="badges-row">
      <!-- Status Badge -->
      <span class="badge" [ngClass]="'badge-status-' + task().status">
        <span class="status-indicator"></span>
        {{ task().status === 'in-progress' ? 'In Progress' : task().status }}
      </span>

      <!-- Priority Badge -->
      <span class="badge" [ngClass]="'badge-priority-' + task().priority">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        {{ task().priority }}
      </span>

      <!-- Overdue Badge -->
      @if (isOverdue()) {
        <span class="badge badge-overdue" title="Due date has passed">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Overdue
        </span>
      }
    </div>

    <!-- Quick Complete Checkbox -->
    <button
      type="button"
      class="complete-toggle-btn"
      [class.checked]="task().status === 'completed'"
      (click)="toggleComplete()"
      [title]="task().status === 'completed' ? 'Mark as In-Progress' : 'Mark as Completed'"
      aria-label="Toggle task completion">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </button>
  </div>

  <!-- Card Body: Title & Description -->
  <div class="card-body">
    <h3 class="task-title" [title]="task().title">{{ task().title }}</h3>
    @if (task().description) {
      <p class="task-description">{{ task().description }}</p>
    } @else {
      <p class="task-description empty-desc">No description provided.</p>
    }
  </div>

  <!-- Card Footer: Due Date & Action Buttons -->
  <div class="card-footer">
    <div class="due-date-info" [class.text-overdue]="isOverdue()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>Due: {{ task().dueDate }}</span>
    </div>

    <div class="card-actions">
      <!-- Edit Task Link -->
      <a
        [routerLink]="['/tasks', task().id, 'edit']"
        class="action-btn edit-btn"
        title="Edit Task"
        aria-label="Edit task"
        id="edit-task-btn-{{ task().id }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </a>

      <!-- Delete Task Button -->
      <button
        type="button"
        class="action-btn delete-btn"
        (click)="onDelete()"
        title="Delete Task"
        aria-label="Delete task"
        id="delete-task-btn-{{ task().id }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    </div>
  </div>
</article>
