<section class="dashboard-summary" aria-label="Task Summary Statistics">
  <!-- Total Tasks -->
  <div
    class="stat-card"
    [class.active]="stateService.filter().status === 'all'"
    (click)="filterByStatus('all')"
    role="button"
    tabindex="0"
    (keydown.enter)="filterByStatus('all')"
    id="stat-total-tasks">
    <div class="stat-icon icon-total">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
    </div>
    <div class="stat-content">
      <span class="stat-label">Total Tasks</span>
      <span class="stat-value" id="stat-value-total">{{ stateService.summary().total }}</span>
    </div>
  </div>

  <!-- In-Progress Tasks -->
  <div
    class="stat-card"
    [class.active]="stateService.filter().status === 'in-progress'"
    (click)="filterByStatus('in-progress')"
    role="button"
    tabindex="0"
    (keydown.enter)="filterByStatus('in-progress')"
    id="stat-inprogress-tasks">
    <div class="stat-icon icon-in-progress">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
    <div class="stat-content">
      <span class="stat-label">In Progress</span>
      <span class="stat-value" id="stat-value-inprogress">{{ stateService.summary().inProgress }}</span>
    </div>
  </div>

  <!-- Completed Tasks -->
  <div
    class="stat-card"
    [class.active]="stateService.filter().status === 'completed'"
    (click)="filterByStatus('completed')"
    role="button"
    tabindex="0"
    (keydown.enter)="filterByStatus('completed')"
    id="stat-completed-tasks">
    <div class="stat-icon icon-completed">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <div class="stat-content">
      <span class="stat-label">Completed</span>
      <span class="stat-value" id="stat-value-completed">{{ stateService.summary().completed }}</span>
    </div>
  </div>

  <!-- Overdue Tasks -->
  <div
    class="stat-card card-overdue"
    [class.has-overdue]="stateService.summary().overdue > 0"
    id="stat-overdue-tasks">
    <div class="stat-icon icon-overdue">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <div class="stat-content">
      <span class="stat-label">Overdue Tasks</span>
      <span class="stat-value" id="stat-value-overdue">{{ stateService.summary().overdue }}</span>
    </div>
  </div>
</section>
