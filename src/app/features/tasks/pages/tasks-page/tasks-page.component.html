<div class="tasks-page">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title-group">
      <h1 class="page-title">Tasks Overview</h1>
      <p class="page-subtitle">Track, filter, and manage your team's workflow and deadlines seamlessly.</p>
    </div>

    <div class="page-actions">
      <!-- Refresh Button -->
      <button
        type="button"
        class="btn btn-secondary btn-sm"
        (click)="refresh()"
        [disabled]="stateService.isLoading()"
        title="Reload tasks from API"
        id="refresh-tasks-btn">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          [class.spin]="stateService.isLoading()">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>Refresh</span>
      </button>

      <!-- Create New Task Button -->
      <a routerLink="/tasks/new" class="btn btn-primary" id="page-new-task-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Create Task</span>
      </a>
    </div>
  </div>

  <!-- Error Banner if operation fails (Requirement 8) -->
  @if (stateService.error()) {
    <div class="error-banner" role="alert" id="tasks-error-banner">
      <div class="error-banner-content">
        <div class="error-banner-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="error-banner-text">
          <strong>Operation Failed:</strong> {{ stateService.error() }}
        </div>
      </div>
      <div class="error-banner-actions">
        <button type="button" class="btn btn-danger btn-sm" (click)="refresh()" id="error-retry-btn">
          Retry
        </button>
        <button type="button" class="btn-close-banner" (click)="clearError()" aria-label="Dismiss error">
          &times;
        </button>
      </div>
    </div>
  }

  <!-- Dashboard Summary Component -->
  <app-task-dashboard></app-task-dashboard>

  <!-- Filter & Search Bar Component -->
  <app-task-filter></app-task-filter>

  <!-- Task List Component -->
  <app-task-list></app-task-list>
</div>
