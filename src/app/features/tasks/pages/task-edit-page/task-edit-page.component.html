<div class="form-page-layout">
  <!-- Navigation Header / Breadcrumbs -->
  <div class="page-top-nav">
    <a routerLink="/tasks" class="back-link" id="edit-back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Tasks</span>
    </a>
  </div>

  @if (isLoading()) {
    <div class="loading-container">
      <app-loading-spinner message="Loading task details..."></app-loading-spinner>
    </div>
  } @else if (notFound()) {
    <div class="form-card not-found-box">
      <div class="not-found-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      <h2>Task Not Found</h2>
      <p>The task with ID '{{ id() }}' could not be found or may have been deleted.</p>
      <a routerLink="/tasks" class="btn btn-primary" id="edit-not-found-back-btn">
        Return to Tasks
      </a>
    </div>
  } @else {
    <!-- Main Form Card -->
    <div class="form-card" id="task-edit-card">
      <div class="card-header">
        <div class="header-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </div>
        <div class="header-text">
          <h1 class="card-title">Edit Task</h1>
          <p class="card-subtitle">Modify task details, update status, or adjust the deadline.</p>
        </div>
      </div>

      <!-- Reusable Task Form Pre-populated -->
      <app-task-form
        [task]="currentTask()"
        [isSubmitting]="isSubmitting()"
        (formSubmit)="handleFormSubmit($event)"
        (formCancel)="handleCancel()">
      </app-task-form>
    </div>
  }
</div>
